<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Körper‑Geometrie‑Emulator</title>
<style>
  body {
    background:#0a0a0a;
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Consolas, monospace;
    overflow:hidden;
  }

  .body {
    position:relative;
    width:900px;
    height:600px;
    perspective:1800px;
  }

  /* Linke Schulter (12°) */
  .shoulder-left {
    position:absolute;
    width:260px;
    height:420px;
    background:linear-gradient(135deg, #00aaff, #0066ff);
    border:3px solid #000;
    transform:
      rotateY(12deg)
      translateX(-220px)
      translateZ(120px)
      rotateX(4deg);
    top:100px;
  }

  /* Rechte Schulter (12°) */
  .shoulder-right {
    position:absolute;
    width:260px;
    height:420px;
    background:linear-gradient(135deg, #ff00aa, #cc0088);
    border:3px solid #000;
    transform:
      rotateY(-12deg)
      translateX(220px)
      translateZ(120px)
      rotateX(4deg);
    top:100px;
  }

  /* Kopf (13° transparent) */
  .head {
    position:absolute;
    width:320px;
    height:320px;
    background:rgba(255,255,255,0.12);
    border:3px solid #000;
    transform:
      rotateX(13deg)
      translateZ(180px);
    left:290px;
    top:150px;
    backdrop-filter:blur(4px);
  }

  /* Torso (freie Fläche) */
  .torso {
    position:absolute;
    width:320px;
    height:320px;
    background:#fff;
    border:3px solid #000;
    left:290px;
    top:150px;
    transform:translateZ(0px);
    z-index:-1;
  }
</style>
</head>
<body>

<div class="body">
  <div class="shoulder-left"></div>
  <div class="shoulder-right"></div>
  <div class="head"></div>
  <div class="torso"></div>
</div>

</body>
</html>
