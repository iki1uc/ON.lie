<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Dreieck‑Screen‑Emulator</title>
<style>
  body {
    background:#111;
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Consolas, monospace;
  }

  .wrapper {
    position:relative;
    width:800px;
    height:600px;
  }

  /* Linker 12° Screen */
  .screen-left {
    position:absolute;
    width:260px;
    height:400px;
    background:#fff;
    border:3px solid #000;
    transform:skewY(-12deg);
    left:0;
    top:100px;
    opacity:0.9;
  }

  /* Rechter 12° Screen */
  .screen-right {
    position:absolute;
    width:260px;
    height:400px;
    background:#fff;
    border:3px solid #000;
    transform:skewY(12deg);
    right:0;
    top:100px;
    opacity:0.9;
  }

  /* Front‑Screen 13° transparent */
  .screen-front {
    position:absolute;
    width:300px;
    height:300px;
    background:rgba(255,255,255,0.15);
    border:3px solid #000;
    transform:skewX(13deg);
    left:250px;
    top:150px;
    backdrop-filter:blur(3px);
  }

  /* Freie Innenfläche */
  .inner-free {
    position:absolute;
    width:300px;
    height:300px;
    background:#fff;
    border:3px solid #000;
    left:250px;
    top:150px;
    z-index:-1;
  }
</style>
</head>
<body>

<div class="wrapper">

  <div class="screen-left"></div>
  <div class="screen-right"></div>
  <div class="screen-front"></div>

  <!-- Freie Fläche für Benutzer -->
  <div class="inner-free"></div>

</div>

</body>
</html>
